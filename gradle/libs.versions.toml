[versions]
agp = "8.13.2"
kotlin = "2.2.21"
composeBom = "2025.12.01"
activity = "1.12.2"
core = "1.17.0"
lifecycle = "2.10.0"
camera = "1.5.2"
junit = "4.13.2"
androidJunit = "1.3.0"
runner = "1.7.0"
espresso = "3.7.0"
mediapipe = "0.10.32"
guava = "33.4.0-android"
webrtc = "150.7871.01"
coroutines = "1.10.2"
datastore = "1.2.1"

[libraries]
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
webrtc = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
mediapipe-vision = { module = "com.google.mediapipe:tasks-vision", version.ref = "mediapipe" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
